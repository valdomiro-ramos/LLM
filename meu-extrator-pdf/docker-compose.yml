version: '3.8'

services:
  # Serviço do Ollama (modelos de IA)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      # 🔥 Usa a pasta "ollama" que você criou na raiz para salvar os modelos
      - ./ollama:/root/.ollama
    restart: unless-stopped
    command: serve

  # Nossa aplicação Python (API + RAG)
  app:
    build: ./app
    container_name: rag-app
    ports:
      - "8000:8000"
    volumes:
      # Pasta onde você coloca os PDFs (dentro de app)
      - ./app/pdfs:/app/pdfs
      - ./faiss_index:/app/faiss_index
      # 🔥 Usa a pasta "chroma" que você criou na raiz para salvar o banco vetorial
      - ./chroma:/app/chroma_db
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ANONYMIZED_TELEMETRY=False   # <---- ADICIONE ESTA LINHA AQUI (desativa o erro do Chroma)
      - CHROMA_TELEMETRY_IMPL=none   # <---- ADICIONE ESTA LINHA
    depends_on:
      - ollama
    # Aguarda o Ollama iniciar e depois sobe a API
    command: sh -c "sleep 10 && uvicorn main:app --host 0.0.0.0 --port 8000"